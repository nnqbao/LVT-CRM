<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Luồng Công việc</title><desc id="d">Người giao tạo công việc, người nhận nộp bằng chứng, người giao duyệt hoặc trả về.</desc><style>
text{font-family:'Montserrat Variable',Montserrat,ui-sans-serif,system-ui,sans-serif}
.t{font-size:17px;font-weight:800;fill:#14355f}
.s{font-size:13px;font-weight:500;fill:#2b465e}
.k{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#0e7363}
.n{font-size:15px;font-weight:800;fill:#fff}
.a{fill:none;stroke:#28639a;stroke-width:2.5;marker-end:url(#arr)}
.ad{fill:none;stroke:#c0472f;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrr)}
.cap{font-size:12px;font-weight:600;fill:#5a6b7c}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#28639a"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c0472f"/></marker>
</defs><rect width="900" height="300" rx="16" fill="#fff"/><rect x="20" y="30" width="250" height="180" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="20" y="30" width="6" height="180" rx="3" fill="#138f7b"/>
<circle cx="50" cy="60" r="15" fill="#c0472f"/><text x="50" y="65" text-anchor="middle" class="n">1</text>
<text x="74" y="54" class="k">NGƯỜI GIAO</text>
<text x="74" y="74" class="t">Tạo công việc</text>
<text x="42" y="102" class="s">Văn thư, BGH, tổ trưởng, tổ phó</text>
<text x="42" y="121" class="s">Giao phòng ban hoặc cá nhân</text>
<text x="42" y="140" class="s">Mỗi dòng: nội dung + hạn chót</text>
<text x="42" y="159" class="s">Việc Văn thư tạo: BGH duyệt trước</text>
<rect x="325" y="30" width="250" height="180" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="325" y="30" width="6" height="180" rx="3" fill="#28639a"/>
<circle cx="355" cy="60" r="15" fill="#c0472f"/><text x="355" y="65" text-anchor="middle" class="n">2</text>
<text x="379" y="54" class="k">NGƯỜI NHẬN</text>
<text x="379" y="74" class="t">Làm và nộp</text>
<text x="347" y="102" class="s">Tab Việc cần làm</text>
<text x="347" y="121" class="s">“Nộp bằng chứng hoàn thành”</text>
<text x="347" y="140" class="s">File + loại văn bản</text>
<rect x="630" y="30" width="250" height="180" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="630" y="30" width="6" height="180" rx="3" fill="#e9ad43"/>
<circle cx="660" cy="60" r="15" fill="#c0472f"/><text x="660" y="65" text-anchor="middle" class="n">3</text>
<text x="684" y="54" class="k">NGƯỜI GIAO</text>
<text x="684" y="74" class="t">Duyệt hoàn thành</text>
<text x="652" y="102" class="s">Duyệt: chấm mức độ %</text>
<text x="652" y="121" class="s">Chưa duyệt: ghi lý do</text>
<text x="652" y="140" class="s">→ người nhận nộp lại</text>
<path class="a" d="M272 120 H322"/>
<path class="a" d="M577 120 H627"/>
<path class="ad" d="M755 212 C755 268 450 268 450 214"/>
<text x="602" y="282" text-anchor="middle" class="cap">Chưa duyệt → trả về kèm lý do</text></svg>
