<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Luồng Lịch công tác</title><desc id="d">Văn thư soạn và nộp lịch tuần, Ban Giám hiệu duyệt hoặc sửa, giáo viên thấy lịch và nhận thông báo. Lịch của tổ do tổ trưởng tạo hiện ngay cho tổ.</desc><style>
text{font-family:'Montserrat Variable',Montserrat,ui-sans-serif,system-ui,sans-serif}
.t{font-size:17px;font-weight:800;fill:#14355f}
.s{font-size:13px;font-weight:500;fill:#2b465e}
.k{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#0e7363}
.n{font-size:15px;font-weight:800;fill:#fff}
.a{fill:none;stroke:#28639a;stroke-width:2.5;marker-end:url(#arr)}
.ad{fill:none;stroke:#c0472f;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrr)}
.cap{font-size:12px;font-weight:600;fill:#5a6b7c}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#28639a"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c0472f"/></marker>
</defs><rect width="900" height="380" rx="16" fill="#fff"/><rect x="20" y="30" width="250" height="170" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="20" y="30" width="6" height="170" rx="3" fill="#138f7b"/>
<circle cx="50" cy="60" r="15" fill="#c0472f"/><text x="50" y="65" text-anchor="middle" class="n">1</text>
<text x="74" y="54" class="k">VĂN THƯ</text>
<text x="74" y="74" class="t">Soạn lịch tuần</text>
<text x="42" y="102" class="s">+ Tạo công tác hoặc Import Excel</text>
<text x="42" y="121" class="s">Bấm “Nộp BGH duyệt”</text>
<text x="42" y="140" class="s">ở Lịch công tác chung</text>
<rect x="325" y="30" width="250" height="170" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="325" y="30" width="6" height="170" rx="3" fill="#e9ad43"/>
<circle cx="355" cy="60" r="15" fill="#c0472f"/><text x="355" y="65" text-anchor="middle" class="n">2</text>
<text x="379" y="54" class="k">BAN GIÁM HIỆU</text>
<text x="379" y="74" class="t">Duyệt hoặc sửa</text>
<text x="347" y="102" class="s">“Duyệt lịch tuần” một lần</text>
<text x="347" y="121" class="s">Sửa trực tiếp: áp dụng ngay,</text>
<text x="347" y="140" class="s">ghi vào Lịch sử chỉnh sửa</text>
<rect x="630" y="30" width="250" height="170" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="630" y="30" width="6" height="170" rx="3" fill="#28639a"/>
<circle cx="660" cy="60" r="15" fill="#c0472f"/><text x="660" y="65" text-anchor="middle" class="n">3</text>
<text x="684" y="54" class="k">GIÁO VIÊN</text>
<text x="684" y="74" class="t">Thấy lịch, nhận báo</text>
<text x="652" y="102" class="s">Lịch cá nhân + Lịch chung</text>
<text x="652" y="121" class="s">Thông báo trên chuông</text>
<text x="652" y="140" class="s">Xác nhận đã tham gia</text>
<path class="a" d="M272 115 H322"/>
<path class="a" d="M577 115 H627"/>
<path class="ad" d="M450 202 C450 260 145 260 145 204"/>
<text x="297" y="268" text-anchor="middle" class="cap">“Trả lại” kèm lý do → Văn thư sửa rồi Nộp lại</text>
<rect x="20" y="290" width="860" height="70" rx="14" fill="#fffdf7" stroke="#dce5eb" stroke-width="1.5"/>
<rect x="20" y="290" width="6" height="70" rx="3" fill="#5a6b7c"/>
<text x="42" y="314" class="k">LỊCH CỦA TỔ</text>
<text x="42" y="334" class="t">Tổ trưởng / tổ phó tạo lịch cho tổ</text>
<text x="42" y="362" class="s">Hiện ngay cho thành viên tổ trong Lịch cá nhân — không cần duyệt, không lên Lịch công tác chung.</text></svg>
